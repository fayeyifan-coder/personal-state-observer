name: Verify backup safety

on:
  push:
    branches:
      - feat/backup-preview-ui-20261028
      - feat/encrypted-snapshot-20261028
  pull_request:
    branches:
      - main
      - feat/backup-comparison-preflight-20261028
      - feat/backup-preview-ui-20261028

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check existing logic contracts
        run: npm run test:logic
      - name: Check analysis
        run: npm run test:analysis
      - name: Check backup comparison
        run: npm run test:backup-comparison
      - name: Check safe backup restore policy
        run: npm run test:backup-restore-policy
      - name: Check encrypted snapshot integrity
        run: npm run test:encrypted-backup
      - name: Typecheck and build
        run: npm run build
      - name: Install isolated browser test dependencies
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium for tests
        run: npx playwright install --with-deps chromium
      - name: Run real browser backup acceptance
        run: node tests/backup-preview.browser.mjs
      - name: Install WebKit test browser
        run: npx playwright install --with-deps webkit
      - name: Run WebKit backup acceptance
        run: BROWSER_ENGINE=webkit node tests/backup-preview.browser.mjs
