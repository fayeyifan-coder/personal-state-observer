name: Verify encrypted sync protocol foundation

on:
  push:
    branches:
      - feat/sync-protocol-foundation-20261028
  pull_request:
    branches:
      - feat/encrypted-snapshot-20261028

permissions:
  contents: read

jobs:
  protocol-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Existing data and analysis checks
        run: npm run test:logic && npm run test:analysis
      - name: Existing backup safety checks
        run: npm run test:backup-comparison && npm run test:backup-restore-policy && npm run test:encrypted-backup
      - name: New encrypted sync protocol checks
        run: npm run test:sync-protocol
      - name: Typecheck and production build
        run: npm run build
      - name: Install Chromium test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Retest existing browser backup flows
        run: node tests/backup-preview.browser.mjs
