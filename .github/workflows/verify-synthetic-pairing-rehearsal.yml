name: Verify synthetic lab offline pairing rehearsal

on:
  push:
    branches:
      - feat/testlab-offline-pairing-rehearsal-20261028
  pull_request:
    branches:
      - test/isolated-phone-lab-20261028

permissions:
  contents: read

jobs:
  chromium-pairing-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Contract bytes matching pending server protocol
        run: npm run test:pairing-wire-contract
      - name: Previous backup and Netlify login safety regressions
        run: |
          npm run test:backup-comparison
          npm run test:backup-restore-policy
          npm run test:encrypted-backup
          npm run test:lab-login-diagnostic
      - name: Compile production and synthetic-only builds
        run: |
          npm run build
          npm run build:testlab
      - name: Install disposable browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser proof with saved CryptoKey and zero network writes
        run: node tests/isolated-lab.browser.mjs

  webkit-pairing-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build isolated synthetic lab
        run: npm run build:testlab
      - name: Install Linux WebKit (not identical to real iPhone Safari)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Persist and prove original phone key under Linux WebKit
        run: node tests/synthetic-device-key.webkit.browser.mjs
