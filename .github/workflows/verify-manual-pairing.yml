name: Verify manually approved pairing against ephemeral PostgreSQL

on:
  push:
    branches:
      - feat/manual-pairing-approval-20261028
  pull_request:
    branches:
      - feat/private-context-device-proof-20261028

permissions:
  contents: read

jobs:
  manual-pairing-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sync_fixture_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d sync_fixture_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: sync_fixture_test
      PGUSER: test_user
      PGPASSWORD: test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Existing backup, sync and phone-signature tests
        run: |
          npm run test:logic
          npm run test:analysis
          npm run test:backup-comparison
          npm run test:backup-restore-policy
          npm run test:encrypted-backup
          npm run test:sync-protocol
          npm run test:sync-service
          npm run test:private-device-auth
      - name: Manual pairing: verify P256 ownership before human approval
        run: npm run test:manual-pairing
      - name: TypeScript and production build
        run: npm run build
      - name: Install Postgres driver only for disposable CI fixture
        run: npm install --no-save --package-lock=false pg@8
      - name: Real ephemeral Postgres manual approval and replacement
        run: npx tsx tests/postgres-manual-pairing.integration.ts
