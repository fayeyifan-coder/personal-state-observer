name: Daily Bark Reminder

on:
  schedule:
    # GitHub Actions cron 使用 UTC。
    # 北京时间 08:00 = UTC 00:00。
    # 北京时间 21:00 = UTC 13:00。
    - cron: '0 0 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send Bark Notification
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$BARK_KEY" ]; then
            echo "错误：未找到 BARK_KEY，请去仓库 Settings 配置"
            exit 1
          fi

          APP_URL="https://fayeyifan-coder.github.io/personal-state-observer/"

          if [ "$SCHEDULE" = "0 0 * * *" ]; then
            TITLE="私人观察台 · 早晨观察"
            BODY="早晨观察时间到了。记录昨夜睡眠和今天醒来时的状态。"
          elif [ "$SCHEDULE" = "0 13 * * *" ]; then
            TITLE="私人观察台 · 晚间总结"
            BODY="晚间总结时间到了。留下今天的情绪、身体状态和生活痕迹。"
          else
            TITLE="私人观察台 · 测试"
            BODY="今天的你是什么样子？打开私人观察台，留下记录吧。"
          fi

          curl -X POST "https://api.day.app/push" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"device_key\": \"$BARK_KEY\",
              \"title\": \"$TITLE\",
              \"body\": \"$BODY\",
              \"url\": \"$APP_URL\"
            }"
