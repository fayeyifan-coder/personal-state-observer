name: Verify complete paged encrypted sync history without silent truncation

on:
  push:
    branches:
      - fix/paginated-sync-history-no-silent-truncation-20261028
  pull_request:
    branches:
      - fix/netlify-function-payload-and-account-preflight-20261028

permissions:
  contents: read

jobs:
  synthetic-page-and-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Page 205 synthetic history revisions without loss or cross-account disclosure
        run: npx tsx tests/sync-history-pagination.test.ts
      - name: Retest Netlify 5 MiB upload and read caps
        run: npx tsx tests/netlify-function-payload.test.ts
      - name: Existing authentication, immutable snapshots, backups and CAS service
        run: |
          npm run test:sync-service
          npm run test:private-device-auth
          npm run test:sync-protocol
      - name: Refuse any hosted function, migration or unsigned approval regression
        run: node tools/sync-deployment-boundary-audit.mjs
      - name: Existing app must still typecheck and build
        run: npm run build

  pg-page-205-revisions:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sync_fixture_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d sync_fixture_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: sync_fixture_test
      PGUSER: test_user
      PGPASSWORD: test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Disposable PG driver only; no Netlify or real data
        run: npm install --no-save --package-lock=false pg@8
      - name: Query 205 synthetic revisions and verify all cursor pages
        run: npx tsx tests/postgres-sync-history-pagination.integration.ts
