name: Verify offline operator CLI on Windows and Linux

on:
  push:
    branches:
      - feat/windows-offline-operator-20261028
  pull_request:
    branches:
      - feat/operator-signed-pairing-gate-20261028

permissions:
  contents: read

jobs:
  operator-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Offline core and command-line safety tests
        run: npx tsx --test tests/operator-offline-cli.test.mjs
      - name: Real interactive Linux terminal with hidden synthetic password
        if: runner.os == 'Linux'
        run: python3 tests/operator-offline-tty-smoke.py
      - name: Existing pairing signature and read-only safety regressions
        run: npm run test:manual-pairing
      - name: Check that normal production build remains unchanged
        run: npm run build
      - name: Ensure no fixture key material was committed
        shell: bash
        run: |
          test ! -e operator-encrypted-private.pem
          test ! -e operator-public.json
          test ! -e tools/operator-encrypted-private.pem
