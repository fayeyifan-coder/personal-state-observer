name: Verify PostgreSQL sync adapter in ephemeral CI only

on:
  push:
    branches:
      - feat/pg-sync-adapter-draft-20261028
  pull_request:
    branches:
      - feat/sync-service-guardrails-20261028

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sync_fixture_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d sync_fixture_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: sync_fixture_test
      PGUSER: test_user
      PGPASSWORD: test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full existing offline contracts
        run: |
          npm run test:logic
          npm run test:analysis
          npm run test:backup-comparison
          npm run test:backup-restore-policy
          npm run test:encrypted-backup
          npm run test:sync-protocol
          npm run test:sync-service
      - name: Verify TypeScript and standalone production build
        run: npm run build
      - name: Install ephemeral pg client for CI fixture only
        run: npm install --no-save --package-lock=false pg@8
      - name: Integration with local disposable Postgres 16
        run: npx tsx tests/postgres-sync.integration.ts
