name: Verify S0/S1 synthetic phone-to-desktop sync integration (offline PG)

on:
  push:
    branches:
      - test/synthetic-sync-e2e-s0-s1-20261028
      - fix/mandatory-signed-pairing-gate-20261028
  pull_request:
    branches:
      - feat/offline-issuer-rotation-audit-20261028
      - test/synthetic-sync-e2e-s0-s1-20261028

permissions:
  contents: read

jobs:
  s0-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refuse unapproved hosted endpoints or unsigned approval
        run: node tools/sync-deployment-boundary-audit.mjs
      - name: Ensure production bundle still compiles
        run: npm run build

  s1-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sync_fixture_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d sync_fixture_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: sync_fixture_test
      PGUSER: test_user
      PGPASSWORD: test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Repeat baseline source-level regressions
        run: |
          npm run test:private-device-auth
          npm run test:manual-pairing
          npm run test:sync-service
      - name: Local disposable PostgreSQL client only
        run: npm install --no-save --package-lock=false pg@8
      - name: Exercise the entire synthetic pairing-to-CAS chain
        run: npx tsx tests/postgres-sync-e2e.integration.ts

  legacy-signed-gate-postgres:
    strategy:
      fail-fast: false
      matrix:
        suite:
          - tests/postgres-manual-pairing.integration.ts
          - tests/postgres-trusted-pairing-evidence.integration.ts
          - tests/postgres-operator-signed-gate.integration.ts
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sync_fixture_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d sync_fixture_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: sync_fixture_test
      PGUSER: test_user
      PGPASSWORD: test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false pg@8
      - name: Old manual pairing regressions must use signed gate
        run: npx tsx ${{ matrix.suite }}
