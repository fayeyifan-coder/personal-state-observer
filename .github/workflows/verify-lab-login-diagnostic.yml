name: Verify private lab read-only login diagnostic

on:
  push:
    branches:
      - feat/private-login-readonly-diagnostic-20261028
  pull_request:
    branches:
      - test/isolated-phone-lab-20261028

permissions:
  contents: read

jobs:
  login-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify read-only function security
        run: npm run test:lab-login-diagnostic
      - name: Verify existing backup and encryption logic
        run: npm run test:backup-comparison && npm run test:backup-restore-policy && npm run test:encrypted-backup
      - name: Build isolated synthetic lab
        run: npm run build:testlab
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify diagnostic and synthetic backup flows in browser
        run: node tests/isolated-lab.browser.mjs
      - name: Ensure ordinary production build still passes
        run: npm run build
