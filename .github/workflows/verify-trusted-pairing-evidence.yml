name: Verify signed pairing evidence and offline trusted approval

on:
  push:
    branches:
      - feat/trusted-pairing-evidence-20261028
  pull_request:
    branches:
      - feat/windows-offline-operator-20261028

permissions:
  contents: read

jobs:
  signed-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci
      - name: Signed evidence and operator manifest tamper tests
        run: npx tsx --test tests/verified-pairing-evidence.test.ts tests/operator-offline-cli.test.mjs
      - name: Linux terminal ceremony with independent issuer pin
        if: runner.os == 'Linux'
        run: python3 tests/operator-offline-tty-smoke.py
      - name: Existing private project and pairing logic regressions
        run: |
          npm run test:manual-pairing
          npm run test:private-device-auth
          npm run test:encrypted-backup
      - name: Ensure official app still builds without operator features
        run: npm run build
      - name: No real key files in checkout
        shell: bash
        run: |
          test ! -e operator-encrypted-private.pem
          test ! -e operator-public.json
          test ! -e trusted-receipt-issuer.json

  evidence-ephemeral-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sync_fixture_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d sync_fixture_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: sync_fixture_test
      PGUSER: test_user
      PGPASSWORD: test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install ephemeral Postgres driver only
        run: npm install --no-save --package-lock=false pg@8
      - name: Confirm proven pending only and revoke receipt against real PostgreSQL
        run: npx tsx tests/postgres-trusted-pairing-evidence.integration.ts
