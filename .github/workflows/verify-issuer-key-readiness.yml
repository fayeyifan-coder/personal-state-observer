name: Verify external issuer key continuity before any hosted enablement

on:
  push:
    branches:
      - test/issuer-key-readiness-no-deploy-20261028
  pull_request:
    branches:
      - fix/mandatory-signed-pairing-gate-20261028

permissions:
  contents: read

jobs:
  offline-issuer-readiness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify old and substituted signing key refusals and independent pin
        run: npx tsx tests/issuer-key-readiness.test.ts
      - name: Refuse accidental deployed functions or migrations
        run: node tools/sync-deployment-boundary-audit.mjs
      - name: Recheck existing pairing and device proof
        run: |
          npm run test:manual-pairing
          npm run test:private-device-auth
      - name: Check production TypeScript and bundle, no deploy
        run: npm run build
      - name: Verify no real keys packaged
        shell: bash
        run: |
          test ! -e operator-encrypted-private.pem
          test ! -e operator-public.json
          test ! -e trusted-receipt-issuer.json
  
  pinned-issuer-pg-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sync_fixture_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d sync_fixture_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: sync_fixture_test
      PGUSER: test_user
      PGPASSWORD: test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Add PG driver only for disposable local database
        run: npm install --no-save --package-lock=false pg@8
      - name: Full synthetic phone-to-desktop chain with pinned issuer startup
        run: npx tsx tests/postgres-sync-e2e.integration.ts
